name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Android SDK & Install Gradle 9.3.1
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          # Accept all Android SDK licenses so AGP 9.1.1 can auto-install compileSdk 36.1
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

          # Install exact Gradle 9.3.1 required by AGP 9.1.1
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          /opt/gradle/gradle-9.3.1/bin/gradle --version

      - name: Prepare Signing Keystores & Environment
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'bossfurniture123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'bossfurniture123' }}
        run: |
          # 1. Always ensure debug.keystore exists in project root for signingConfigs.debugConfig
          if [ ! -f "${{ github.workspace }}/debug.keystore" ]; then
            if [ -s "${{ github.workspace }}/debug.keystore.base64" ]; then
              base64 -d "${{ github.workspace }}/debug.keystore.base64" > "${{ github.workspace }}/debug.keystore"
            else
              keytool -genkeypair -v \
                -keystore "${{ github.workspace }}/debug.keystore" \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          ls -lh "${{ github.workspace }}/debug.keystore"

          # 2. Always ensure my-upload-key.jks exists in project root for signingConfigs.release
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
          elif [ ! -f "${{ github.workspace }}/my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Boss Furniture, OU=Factory Dispatch, O=Boss Furniture, L=Colombo, ST=Western, C=LK"
          fi
          ls -lh "${{ github.workspace }}/my-upload-key.jks"

          # 3. Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f "${{ github.workspace }}/.env" ]; then
            if [ -f "${{ github.workspace }}/.env.example" ]; then
              cp "${{ github.workspace }}/.env.example" "${{ github.workspace }}/.env"
            else
              echo "GEMINI_API_KEY=" > "${{ github.workspace }}/.env"
            fi
          fi

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'bossfurniture123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'bossfurniture123' }}
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          gradle assembleDebug -Pkotlin.compiler.execution.strategy=daemon --no-configuration-cache
          gradle assembleRelease -Pkotlin.compiler.execution.strategy=daemon --no-configuration-cache

      - name: Prepare Release APK Files
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-release.apk release-apks/BossFurniture-Scanner-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/BossFurniture-Scanner-debug.apk
          ls -lh release-apks/

      - name: Publish APKs to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi

          NOTES="## Boss Furniture Factory Dispatch & Return QR Scanner
          Installable Android APKs built automatically via GitHub Actions.

          ### Included Files
          - **BossFurniture-Scanner-release.apk** — Signed production release APK
          - **BossFurniture-Scanner-debug.apk** — Signed debug APK

          ### Highlights
          - Dispatch & Return modes with maximized live CameraX + ML Kit QR scanning
          - Vehicle & Driver assignment (DAC-4912 Rathnayake, DAE-4217 Lasantha, Pick Me, and Custom Vehicles)
          - Strict GATE PASS driver assignment rule & 4-copy (GATE PASS, ACCOUNT COPY, TRANSPORT COPY, PRODUCTION COPY) tracking
          - Local (Room SQLite) + Cloud (Supabase) duplicate prevention
          - Offline-first queue with automatic background sync
          - All scan timestamps recorded in Sri Lanka Standard Time (Asia/Colombo, UTC+05:30)"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              release-apks/BossFurniture-Scanner-release.apk \
              release-apks/BossFurniture-Scanner-debug.apk \
              --clobber
          else
            gh release create "$TAG_NAME" \
              release-apks/BossFurniture-Scanner-release.apk \
              release-apks/BossFurniture-Scanner-debug.apk \
              --title "Boss Furniture QR Scanner ($TAG_NAME)" \
              --notes "$NOTES" \
              --latest
          fi
