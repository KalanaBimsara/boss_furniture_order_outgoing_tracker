name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare Signing Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'bossfurniture123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'bossfurniture123' }}
        run: |
          # Ensure debug.keystore exists from debug.keystore.base64
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Prepare release keystore (use GitHub Secret if configured, otherwise generate upload key)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          elif [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Boss Furniture, OU=Factory Dispatch, O=Boss Furniture, L=Colombo, ST=Western, C=LK"
          fi

          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'bossfurniture123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'bossfurniture123' }}
        run: |
          gradle assembleDebug assembleRelease --no-daemon

      - name: Rename APKs for Release
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-release.apk release-apks/BossFurniture-Scanner-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/BossFurniture-Scanner-debug.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BossFurniture-Scanner-APKs
          path: release-apks/*.apk

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            echo "tag_name=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Boss Furniture QR Scanner (${{ steps.tag.outputs.tag_name }})"
          body: |
            ## Boss Furniture Factory Dispatch & Return QR Scanner
            Installable Android APKs built automatically via GitHub Actions.

            ### Included Files
            - **`BossFurniture-Scanner-release.apk`** — Signed production release APK
            - **`BossFurniture-Scanner-debug.apk`** — Signed debug APK

            ### Highlights
            - Dispatch & Return modes with live CameraX + ML Kit QR scanning
            - Vehicle & Driver assignment (`DAC-4912 Rathnayake`, `DAE-4217 Lasantha`, `Pick Me`, and Custom Vehicles)
            - Strict `GATE PASS` driver assignment rule & 4-copy (`GATE PASS`, `ACCOUNT COPY`, `TRANSPORT COPY`, `PRODUCTION COPY`) tracking
            - Local (Room SQLite) + Cloud (Supabase) duplicate prevention
            - Offline-first queue with automatic background sync
            - All scan timestamps recorded in Sri Lanka Standard Time (`Asia/Colombo`, UTC+05:30)
          files: |
            release-apks/BossFurniture-Scanner-release.apk
            release-apks/BossFurniture-Scanner-debug.apk
          prerelease: false
          make_latest: true
